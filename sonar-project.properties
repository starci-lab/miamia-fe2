sonar.projectKey=miamia-fe
sonar.projectName=Mia Mia Frontend
sonar.host.url=https://sonar.starci.org
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/.next/**,**/coverage/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The JS/TS analyzer runs in a bridge Node process whose default heap is sized for a small
# project. Handed a tree this size at the default, the bridge dies mid-analysis with
# "bridge server is unresponsive" - which surfaces as a failed scan, not as a coverage result.
sonar.javascript.node.maxspace=8192
